# Local demo backend: one small Postgres with two databases —
#   genzeon_src: the "company" source system (seeded Genzeon engineering data)
#   warehouse:   GetInsightful's local warehouse (Airbyte connector target)
# Seed is mounted at /seed and applied by the setup wizard (or tests/README).
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: insightful
      POSTGRES_PASSWORD: insightful
      POSTGRES_DB: genzeon_src
    volumes:
      - genzeon_pg:/var/lib/postgresql/data
      - ./seed:/seed:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightful -d genzeon_src"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  genzeon_pg:
